version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Backend Lambda (requirements.txt / requirements-dev.txt)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # Terraform root and modules
  - package-ecosystem: terraform
    directories:
      - /infra/terraform
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ['*']

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
