name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — Format & E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v7
        with:
          working-directory: frontend
          start: pnpm dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 60
          command: pnpm cypress run

  backend:
    name: Backend — Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=src --cov-fail-under=80

  handler-changes:
    name: Detect backend handler changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      handlers: ${{ steps.diff.outputs.handlers }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changes under backend/src/handlers/
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- backend/src/handlers/; then
            echo "handlers=false" >> "$GITHUB_OUTPUT"
          else
            echo "handlers=true" >> "$GITHUB_OUTPUT"
          fi

  backend-benchmarks:
    name: Backend — Performance Benchmarks
    runs-on: ubuntu-latest
    needs: handler-changes
    if: needs.handler-changes.outputs.handlers == 'true'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run performance benchmarks
        run: pytest tests/benchmarks/ --benchmark-only --benchmark-json=benchmark-results.json -v

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: backend/benchmark-results.json
